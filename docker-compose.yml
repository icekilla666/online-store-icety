networks:
  dev:

services:
  postgres:
    image: postgres:15-alpine
    container_name: online-store-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: icekilla666
      POSTGRES_DB: realme_store
    ports:
      - "5001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_NAME: realme_store
      DB_USER: postgres
      DB_PASSWORD: icekilla666
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: supersecretkey123
    networks:
      - dev
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    networks:
      - dev
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - dev
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  dev: