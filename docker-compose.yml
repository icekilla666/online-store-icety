networks:
  dev:

services:
  nginx: 
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    networks:
      - dev

  backend:
    build:
      context: ./server
    networks:
      - dev

  frontend:
    build:
      context: ./client
    networks:
      - dev